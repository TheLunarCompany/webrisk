name: Webrisk Docker Build Push
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GCR_REGISTRY: us-central1-docker.pkg.dev/prj-common-442813/lunar-private

jobs:
  docker:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        app:
          [
            {
              name: "webrisk-server",
              context: ".",
              dockerfile: "./Dockerfile"
            }
          ]

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Auth to GCR
        run: |
          gcloud auth configure-docker $(awk -F '/' {'print $1'} <<< ${{ env.GCR_REGISTRY }}) --quiet

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.GCR_REGISTRY }}/${{ matrix.app.image_prefix }}${{ matrix.app.name }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: "{{defaultContext}}:${{ matrix.app.context }}"
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.app.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          push: true

        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
